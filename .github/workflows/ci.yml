name: CI

on:
  push:
    branches:
      - dev
  pull_request:

concurrency:
  group: dev-padars-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:8-alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:8-alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.2'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench==5.31.0
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          git -C ~/frappe-bench/apps/frappe checkout 4515014c87ece6cb20ee91d2cfb121c5cbd1ff4a

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app erpnext https://github.com/frappe/erpnext --branch version-16
          bench get-app education https://github.com/frappe/education --branch version-16
          git -C apps/erpnext checkout 5af6561f5aa48104559692fb4fd82f2580e8d338
          git -C apps/education checkout 93bc7075753369457919720690f80c6d2207b5f2
          bench get-app padars $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app education
          bench --site test_site install-app padars
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app padars
        env:
          TYPE: server
