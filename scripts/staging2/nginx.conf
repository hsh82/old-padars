worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  error_log /dev/stderr warn;
  sendfile on;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 80;
    server_name stage2.kara.loc;
    root /workspace/frappe-bench/sites;
    client_max_body_size 50m;
    add_header X-Padars-Site stage2.kara.loc always;
    add_header X-Padars-Environment "Staging 2" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    location /assets/ { try_files $uri =404; }
    location ~ ^/protected/(.*) { internal; try_files /stage2.kara.loc/$1 =404; }
    location /socket.io {
      proxy_pass http://socketio:9000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Frappe-Site-Name stage2.kara.loc;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
    }
    location ~* ^/files/.*\.(htm|html|svg|xml)$ {
      add_header Content-Disposition attachment;
      try_files /stage2.kara.loc/public/$uri @webserver;
    }
    location / { try_files /stage2.kara.loc/public/$uri @webserver; }
    location @webserver {
      proxy_pass http://web:8000;
      proxy_set_header X-Frappe-Site-Name stage2.kara.loc;
      proxy_set_header Host stage2.kara.loc;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120;
      proxy_redirect off;
    }
  }
}
